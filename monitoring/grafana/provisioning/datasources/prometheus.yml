apiVersion: 1

datasources:
  - name: Prometheus
    # 대시보드 JSON이 이 uid로 데이터소스를 찾는다. 바꾸면 대시보드도 함께 바꿔야 한다
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # 스크레이프 간격과 맞춰야 $__rate_interval이 너무 짧게 잡혀 rate()가 비는 일이 없다
      timeInterval: 5s
