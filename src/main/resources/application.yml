server:
  tomcat:
    # k6 시나리오 A처럼 연결 200개가 한꺼번에 들어오면 기본 대기열(100)이 넘쳐 연결이 거부될 수 있다
    # (Windows는 대기열이 넘치면 연결을 즉시 거부). 부하 테스트 측정 조건을 재현할 수 있도록 늘려 둔다.
    accept-count: 1000

spring:
  application:
    name: mega-order
  config:
    # compose.yaml과 같은 .env 값을 사용 (프로젝트 루트에서 실행 기준)
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3307/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
