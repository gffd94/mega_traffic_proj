server:
  tomcat:
    # k6 시나리오 A처럼 연결 200개가 한꺼번에 들어오면 기본 대기열(100)이 넘쳐 연결이 거부될 수 있다
    # (Windows는 대기열이 넘치면 연결을 즉시 거부). 부하 테스트 측정 조건을 재현할 수 있도록 늘려 둔다.
    accept-count: 1000

spring:
  application:
    name: mega-order
  config:
    # compose.yaml과 같은 .env 값을 사용 (프로젝트 루트에서 실행 기준)
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3307/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    # Outbox Relay가 "브로커가 메시지를 받았는지(confirm)"와 "큐까지 라우팅됐는지(return)"를 확인하기 위한 설정
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # 예외로 끝난 메시지를 다시 큐에 넣지 않는다 (넣으면 같은 실패가 끝없이 반복된다)
        default-requeue-rejected: false
        # 일시적 오류(DB 연결 끊김 등)에 대비해 처음 포함 최대 3번 시도한다. 1초 → 2초 간격.
        # 3번 모두 실패하면 SagaMessageRecoverer가 에러 로그를 남기고 reject한다.
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2

mega:
  outbox:
    relay:
      # READY가 바닥났을 때 다음 조회까지 쉬는 시간. 꽉 찬 배치(100건)는 쉬지 않고 바로 이어서 조회한다
      idle-delay-ms: 100
      # 한 배치의 confirm을 모두 기다리는 상한. 넘긴 이벤트는 READY로 남아 다음 조회에서 다시 전송된다
      confirm-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        # Prometheus 스크레이프와 상태 확인에 필요한 것만 연다 (env, beans 등은 설정값이 노출되므로 닫아 둔다)
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Grafana에서 histogram_quantile로 p95를 계산하려면 버킷(_bucket)이 필요하다
      percentiles-histogram:
        http.server.requests: true
